name: Actualizar datos de gusto (Mercado Libre)

on:
  schedule:
    # Todos los días a las 09:00 UTC (06:00 hora Argentina)
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # también podés apretar "Run workflow" a mano desde GitHub

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: pip install requests

      - name: Correr el recolector
        run: python gusto_scraper.py --meli MLA899116906 MLA2842747978 MLA1154216485 MLA2764820540 MLA1519681677 MLA1445843893 MLA3612836800 MLA1496835113

      - name: Guardar data.json actualizado
        run: |
          git config user.name "gusto-bot"
          git config user.email "gusto-bot@users.noreply.github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "Actualización automática de datos"
          git push

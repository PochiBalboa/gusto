<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CONSTELACIÓN — inspiración, diseño, craft, pausa, equilibrio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --bg-2: #111111;
    --ink: #ffffff;
    --ink-dim: rgba(255,255,255,0.68);
    --line: rgba(255,255,255,0.16);
    --c-comida-1: #ff6b6b; --c-comida-2: #ffb347;
    --c-musica-1: #4ecdc4; --c-musica-2: #556fb5;
    --c-gente-1: #ffd93d; --c-gente-2: #ff6b9d;
    --c-vida-1: #a78bfa; --c-vida-2: #60a5fa;
    --c-otro-1: #c084fc; --c-otro-2: #818cf8;
    --shadow: 0 24px 70px rgba(0,0,0,0.55);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: inherit; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
  }
  body {
    background: var(--bg);
  }

  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  header {
    position: absolute;
    top: calc(22px + env(safe-area-inset-top, 0px));
    left: 24px;
    right: 24px;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
  }
  .brand { pointer-events: auto; max-width: 420px; }
  .brand h1 {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-style: normal;
    font-size: clamp(30px, 5.5vw, 48px);
    margin: 0 0 4px 0;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .brand p {
    margin: 0;
    color: var(--ink-dim);
    font-size: 14px;
    line-height: 1.5;
    max-width: 36ch;
  }
  .count {
    pointer-events: auto;
    text-align: right;
    font-size: 13px;
    color: var(--ink-dim);
    line-height: 1.6;
  }
  .count strong {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
  }

  .legend {
    position: absolute;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    left: 24px;
    right: 24px;
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    color: var(--ink);
    font-size: 13px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .chip:hover { transform: translateY(-2px); }
  .chip.off { opacity: 0.35; }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; }

  .field {
    position: absolute;
    inset: 0;
    z-index: 2;
  }

  .dots-layer {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  /* Estrellas decorativas de fondo: solo textura, no son datos, no son clickeables */
  .bgstar {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: twinkle ease-in-out infinite alternate;
  }

  /* Estrellas reales: cada una es una frase, clickeable, con brillo tipo estrella */
  .bubble {
    position: absolute;
    border-radius: 50%;
    cursor: pointer;
    animation: twinkle ease-in-out infinite alternate;
    transition: filter 0.15s ease;
    will-change: left, top;
    box-shadow: 0 0 5px 1px var(--glow, rgba(255,255,255,0.35));
  }
  .bubble:hover {
    filter: brightness(1.4);
    z-index: 5;
  }
  .bubble.hidden { opacity: 0 !important; pointer-events: none; }

  @keyframes drift {
    from { transform: translate(0, 0) rotate(0deg); }
    to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot, 8deg)); }
  }
  @keyframes twinkle {
    from { opacity: var(--op-a, 0.55); }
    to   { opacity: var(--op-b, 1); }
  }

  .cursor-word {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 0;
    color: #000000;
    -webkit-text-stroke: 3px #ffffff;
    paint-order: stroke fill;
    font-weight: 700;
    font-size: clamp(70px, 18vw, 320px);
    letter-spacing: -0.02em;
    text-transform: uppercase;
    white-space: nowrap;
    pointer-events: none;
    line-height: 1;
    transform: translate(-50%, -50%);
    -webkit-mask-image: radial-gradient(circle 0px at 50% 50%, #fff 0%, transparent 100%);
    mask-image: radial-gradient(circle 0px at 50% 50%, #fff 0%, transparent 100%);
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(2px);
    display: none;
    z-index: 50;
  }
  .overlay.open { display: flex; }
  .sidebar {
    margin-left: auto;
    width: min(440px, 92vw);
    height: 100%;
    background: var(--bg-2);
    border-left: 1px solid var(--line);
    padding: 32px 34px;
    overflow-y: auto;
    box-sizing: border-box;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: -40px 0 70px rgba(0,0,0,0.5);
  }
  .overlay.open .sidebar { transform: translateX(0); }
  .sidebar-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
  }
  .sidebar-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--c-otro-1);
    font-weight: 700;
  }
  .sidebar-close {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: none;
    color: var(--ink);
    cursor: pointer;
    font-size: 13px;
    flex-shrink: 0;
  }
  .sidebar-close:hover { border-color: var(--ink); }
  .sidebar-icon {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    margin-bottom: 26px;
    box-shadow: 0 0 22px 4px var(--glow, transparent);
  }
  .sidebar-quote {
    font-family: 'Inter', sans-serif;
    font-size: 26px;
    font-weight: 600;
    line-height: 1.36;
    margin: 0 0 16px 0;
  }
  .sidebar-desc {
    color: var(--ink-dim);
    font-size: 14px;
    line-height: 1.55;
    margin: 0;
  }
  .sidebar-divider {
    border: none;
    border-top: 1px solid var(--line);
    margin: 28px 0;
  }
  .sidebar-meta {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0;
  }
  @media (max-width: 640px) {
    .sidebar { width: 100%; border-left: none; }
  }

  .note {
    position: absolute;
    top: calc(22px + env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    font-size: 11px;
    color: var(--ink-dim);
    background: rgba(0,0,0,0.6);
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    text-align: center;
    display: none;
  }
  @media (max-width: 640px) {
    header { flex-direction: column; gap: 14px; }
    .count { text-align: left; }
    .note { display: block; }
    .brand p { max-width: none; }
  }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .bubble, .bgstar { animation: none !important; opacity: 0.85 !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="dots-layer" id="dotsLayer"></div>
  <div class="cursor-word" id="cursorWord">taste</div>

  <div class="field" id="field"></div>

  <div class="legend" id="legend"></div>
</div>

<div class="overlay" id="overlay">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <span class="sidebar-label">UNA VOZ DE LA WEB</span>
      <button id="closeCard" class="sidebar-close" aria-label="Cerrar">✕</button>
    </div>
    <div class="sidebar-icon" id="sidebarIcon"></div>
    <p class="sidebar-quote" id="cardPhrase"></p>
    <p class="sidebar-desc" id="cardDesc"></p>
    <hr class="sidebar-divider">
    <p class="sidebar-meta" id="cardMeta"></p>
  </aside>
</div>

<script>
const CATEGORIES = {
  inspiracion: { label: 'Inspiración', c1: 'var(--c-otro-1)',   c2: 'var(--c-otro-2)' },
  diseno:      { label: 'Diseño',      c1: 'var(--c-comida-1)', c2: 'var(--c-comida-2)' },
  craft:       { label: 'Craft',       c1: 'var(--c-musica-1)', c2: 'var(--c-musica-2)' },
  pausa:       { label: 'Pausa',       c1: 'var(--c-gente-1)',  c2: 'var(--c-gente-2)' },
  equilibrio:  { label: 'Equilibrio',  c1: 'var(--c-vida-1)',   c2: 'var(--c-vida-2)' },
};

const FALLBACK_DATA = [
  { cat:'inspiracion', text:'La inspiración existe, pero tiene que encontrarte trabajando.', author: 'Pablo Picasso' },
  { cat:'diseno', text:'El buen diseño es tan poco diseño como sea posible.', author: 'Dieter Rams' },
  { cat:'craft', text:'Lo hecho a mano lleva tiempo adentro, no solo materiales.' },
  { cat:'pausa', text:'Parar también es avanzar.' },
  { cat:'equilibrio', text:'El equilibrio no es algo que encontrás, es algo que creás.', author: 'Jana Kingsford' },
];

let DATA = FALLBACK_DATA;
let usingFallback = true;

const field = document.getElementById('field');
const dotsLayer = document.getElementById('dotsLayer');
const legend = document.getElementById('legend');
const overlay = document.getElementById('overlay');
const card = document.getElementById('card');
const sidebarIcon = document.getElementById('sidebarIcon');
const cardDesc = document.getElementById('cardDesc');
const sidebar = document.getElementById('sidebar');
const cardPhrase = document.getElementById('cardPhrase');
const cardMeta = document.getElementById('cardMeta');

const activeCats = new Set(Object.keys(CATEGORIES));

function clusteredOffset(spread) {
  const r = (Math.random() + Math.random() + Math.random() + Math.random()) / 4;
  return (r - 0.5) * 2 * spread;
}

function layoutBubbles() {
  const w = field.clientWidth;
  const h = field.clientHeight;
  const cx = w / 2, cy = h / 2;
  const spreadX = w * 0.42, spreadY = h * 0.38;
  DATA.forEach((item) => {
    const size = 4 + Math.random() * 20;
    item._x = cx + clusteredOffset(spreadX) - size / 2;
    item._y = cy + clusteredOffset(spreadY) - size / 2;
    item._size = size;
  });
}

const DOT_COUNT = 950;

const dustStars = [];

function buildDecorativeDots() {
  dotsLayer.innerHTML = '';
  dustStars.length = 0;
  const w = dotsLayer.clientWidth, h = dotsLayer.clientHeight;
  const cx = w / 2, cy = h / 2;
  const spreadX = w * 0.46, spreadY = h * 0.42;
  const palette = Object.values(CATEGORIES).flatMap(c => [c.c1, c.c2]);
  const frag = document.createDocumentFragment();
  for (let i = 0; i < DOT_COUNT; i++) {
    const dot = document.createElement('div');
    dot.className = 'bgstar';
    const size = 2 + Math.random() * 6;
    const x = cx + clusteredOffset(spreadX) - size / 2;
    const y = cy + clusteredOffset(spreadY) - size / 2;
    const color = Math.random() < 0.75
      ? palette[Math.floor(Math.random() * palette.length)]
      : '#ffffff';
    dot.style.left = x + 'px';
    dot.style.top = y + 'px';
    dot.style.width = size + 'px';
    dot.style.height = size + 'px';
    dot.style.background = color;
    dot.style.setProperty('--op-a', (0.3 + Math.random() * 0.3).toFixed(2));
    dot.style.setProperty('--op-b', (0.7 + Math.random() * 0.3).toFixed(2));
    dot.style.animationDuration = (2 + Math.random() * 4) + 's';
    dot.style.animationDelay = (Math.random() * -6) + 's';
    frag.appendChild(dot);
    dustStars.push({ x, y, size, offX: 0, offY: 0, el: dot });
  }
  dotsLayer.appendChild(frag);
}

const stars = [];

function render() {
  field.querySelectorAll('.bubble').forEach(el => el.remove());
  stars.length = 0;
  DATA.forEach((item) => {
    const el = document.createElement('div');
    el.className = 'bubble' + (activeCats.has(item.cat) ? '' : ' hidden');
    const c = CATEGORIES[item.cat];
    el.style.left = item._x + 'px';
    el.style.top = item._y + 'px';
    el.style.width = item._size + 'px';
    el.style.height = item._size + 'px';
    el.style.background = `radial-gradient(circle at 35% 30%, ${c.c1} 0%, ${c.c2} 100%)`;
    el.style.setProperty('--glow', `color-mix(in srgb, ${c.c1} 70%, transparent)`);
    el.style.setProperty('--op-a', (0.6 + Math.random() * 0.2).toFixed(2));
    el.style.setProperty('--op-b', '1');
    const twinkleDur = 1.5 + Math.random() * 3;
    el.style.animationDuration = `${twinkleDur}s`;
    el.style.animationDelay = `${Math.random() * -twinkleDur}s`;
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', item.text);
    el.addEventListener('click', () => openCard(item));
    el.addEventListener('keypress', (e) => { if (e.key === 'Enter') openCard(item); });
    field.appendChild(el);
    if (activeCats.has(item.cat)) {
      item._offX = 0; item._offY = 0;
      stars.push({ item, el });
    }
  });
}

let mouseX = null, mouseY = null;
const DODGE_RADIUS = 38;
const CATCH_RADIUS = 30;
const DODGE_STEP = 1.6;
const MAX_OFFSET = 18;
const RETURN_DECAY = 0.06;

const cursorWord = document.getElementById('cursorWord');
const REVEAL_RADIUS = 170;

field.addEventListener('mousemove', (e) => {
  const rect = field.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;

  const wordRect = cursorWord.getBoundingClientRect();
  const mx = e.clientX - wordRect.left;
  const my = e.clientY - wordRect.top;
  const mask = `radial-gradient(circle ${REVEAL_RADIUS}px at ${mx}px ${my}px, #fff 0%, transparent 100%)`;
  cursorWord.style.maskImage = mask;
  cursorWord.style.webkitMaskImage = mask;
});
field.addEventListener('mouseleave', () => {
  mouseX = null; mouseY = null;
  const hidden = 'radial-gradient(circle 0px at 50% 50%, #fff 0%, transparent 100%)';
  cursorWord.style.maskImage = hidden;
  cursorWord.style.webkitMaskImage = hidden;
});

const DUST_RADIUS = 140;
const DUST_MAX = 90;
const DUST_STEP = 4.5;

function dodgeLoop() {
  for (const s of stars) {
    const item = s.item;
    const curX = item._x + item._offX + item._size / 2;
    const curY = item._y + item._offY + item._size / 2;

    if (mouseX !== null) {
      const dx = curX - mouseX, dy = curY - mouseY;
      const dist = Math.hypot(dx, dy) || 0.001;
      if (dist < CATCH_RADIUS) {
        // Congelada
      } else if (dist < DODGE_RADIUS) {
        const strength = (DODGE_RADIUS - dist) / (DODGE_RADIUS - CATCH_RADIUS);
        item._offX += (dx / dist) * DODGE_STEP * strength;
        item._offY += (dy / dist) * DODGE_STEP * strength;
        const mag = Math.hypot(item._offX, item._offY);
        if (mag > MAX_OFFSET) {
          item._offX = (item._offX / mag) * MAX_OFFSET;
          item._offY = (item._offY / mag) * MAX_OFFSET;
        }
      } else {
        item._offX *= (1 - RETURN_DECAY);
        item._offY *= (1 - RETURN_DECAY);
      }
    } else {
      item._offX *= (1 - RETURN_DECAY);
      item._offY *= (1 - RETURN_DECAY);
    }

    s.el.style.left = (item._x + item._offX) + 'px';
    s.el.style.top = (item._y + item._offY) + 'px';
  }

  for (const d of dustStars) {
    const curX = d.x + d.offX + d.size / 2;
    const curY = d.y + d.offY + d.size / 2;

    if (mouseX !== null) {
      const dx = curX - mouseX, dy = curY - mouseY;
      const dist = Math.hypot(dx, dy) || 0.001;
      if (dist < DUST_RADIUS) {
        const strength = (DUST_RADIUS - dist) / DUST_RADIUS;
        d.offX += (dx / dist) * DUST_STEP * strength;
        d.offY += (dy / dist) * DUST_STEP * strength;
        const mag = Math.hypot(d.offX, d.offY);
        if (mag > DUST_MAX) {
          d.offX = (d.offX / mag) * DUST_MAX;
          d.offY = (d.offY / mag) * DUST_MAX;
        }
      } else {
        d.offX *= (1 - RETURN_DECAY);
        d.offY *= (1 - RETURN_DECAY);
      }
    } else {
      d.offX *= (1 - RETURN_DECAY);
      d.offY *= (1 - RETURN_DECAY);
    }

    d.el.style.left = (d.x + d.offX) + 'px';
    d.el.style.top = (d.y + d.offY) + 'px';
  }

  requestAnimationFrame(dodgeLoop);
}
requestAnimationFrame(dodgeLoop);

function openCard(item) {
  const c = CATEGORIES[item.cat];
  const isPopular = item.author === 'dicho popular';
  sidebarIcon.style.background = `radial-gradient(circle at 35% 30%, ${c.c1} 0%, ${c.c2} 100%)`;
  sidebarIcon.style.setProperty('--glow', `color-mix(in srgb, ${c.c1} 60%, transparent)`);
  cardPhrase.textContent = item.text;
  cardDesc.textContent = isPopular
    ? `Un dicho real que circula online sobre ${c.label.toLowerCase()}.`
    : `Una cita real de ${item.author}.`;
  cardMeta.textContent = (isPopular ? 'DICHO POPULAR' : ('CITA · ' + item.author.toUpperCase())) + ' · ' + c.label.toUpperCase();
  sidebar.scrollTop = 0;
  overlay.classList.add('open');
}
document.getElementById('closeCard').addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });

function buildLegend() {
  legend.innerHTML = '';
  Object.entries(CATEGORIES).forEach(([key, c]) => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `<span class="dot" style="background:linear-gradient(135deg, ${c.c1}, ${c.c2})"></span>${c.label}`;
    chip.addEventListener('click', () => {
      if (activeCats.has(key)) { activeCats.delete(key); chip.classList.add('off'); }
      else { activeCats.add(key); chip.classList.remove('off'); }
      render();
    });
    legend.appendChild(chip);
  });
}

async function loadRealData() {
  try {
    const res = await fetch('./data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('sin data.json todavía');
    const json = await res.json();
    const items = Array.isArray(json) ? json : json.items;
    if (!items || !items.length) throw new Error('data.json vacío');
    DATA = items.map(it => ({ cat: CATEGORIES[it.category] ? it.category : 'inspiracion', text: it.text, author: it.author }));
    usingFallback = false;
  } catch (e) {
    // Sin data.json disponible: se queda con FALLBACK_DATA.
  }
  layoutBubbles();
  render();
}

layoutBubbles();
render();
buildDecorativeDots();
buildLegend();
loadRealData();
window.addEventListener('resize', () => { layoutBubbles(); render(); buildDecorativeDots(); });
window.addEventListener('load', () => { layoutBubbles(); render(); buildDecorativeDots(); });
setTimeout(() => { layoutBubbles(); render(); buildDecorativeDots(); }, 400);
</script>

</body>
</html>
